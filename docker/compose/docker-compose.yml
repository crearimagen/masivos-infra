# docker/compose/docker-compose.yml — compose principal que orquesta todos
# los servicios de services/*. Cada servicio sigue siendo un compose
# independiente y ejecutable por si solo (docker compose -f
# services/<nombre>/docker-compose.yml up).
#
# La lista de "include" crece a medida que cada servicio se completa en su
# propio sprint. No incluir aqui un servicio cuyo docker-compose.yml todavia
# no este implementado. grafana, prometheus, loki y uptime-kuma se agregan
# en los Sprints 10-11, cuando existan.
#
# NOTA (Sprint 9): services/postal no esta en masivos-network
# (network_mode: host, ver services/postal/README.md), por lo que no lo
# incluye este compose - se levanta por separado. Incluirlo aqui no fallaria
# (Compose soporta mezclar network_mode: host con otros servicios en el
# mismo archivo), pero se mantiene fuera para dejar explicito que su ciclo
# de vida de arranque es distinto (requiere el paso manual "postal
# make-user" antes de poder operar, ver services/postal/README.md).
#
# Uso: docker compose --env-file ../../environments/<env>/.env -f docker-compose.yml up -d

name: masivos

networks:
  masivos-network:
    external: true

volumes:
  masivos-mariadb-data:
    external: true
  masivos-postgres-data:
    external: true
  masivos-rabbitmq-data:
    external: true
  masivos-redis-data:
    external: true
  masivos-postal-data:
    external: true
  masivos-nginx-data:
    external: true

include:
  - ../../services/mariadb/docker-compose.yml
  - ../../services/postgres/docker-compose.yml
  - ../../services/rabbitmq/docker-compose.yml
  - ../../services/redis/docker-compose.yml
  - ../../services/nginx/docker-compose.yml
