# security/logrotate/masivos.conf
# Instalado en /etc/logrotate.d/masivos por apply-logrotate.sh.
# Cubre los logs propios de los scripts de masivos-infra
# (/var/log/masivos/*.log, generados por bootstrap/, security/ y scripts/).
# Los logs de los contenedores Docker se rotan via docker/daemon.json
# (Sprint 3), no aqui.

/var/log/masivos/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
    sharedscripts
}
