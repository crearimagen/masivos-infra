# security/sysctl/99-masivos-hardening.conf
# Instalado en /etc/sysctl.d/99-masivos-hardening.conf por apply-sysctl.sh.
# Archivo estatico (sin placeholders) — no depende del entorno.

# --- Docker: REQUERIDO, no desactivar ---
# Docker necesita ip_forward=1 para enrutar trafico entre masivos-network y
# el exterior (NAT) y entre contenedores. La mayoria de guias de hardening
# genericas recomiendan desactivarlo; en este servidor romperia todo el
# stack de Sprint 3 en adelante. Ver docs/architecture.md.
net.ipv4.ip_forward = 1

# --- Anti-spoofing ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# --- Rechazar source routing ---
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# --- Ignorar ICMP redirects (previene ataques de tipo man-in-the-middle) ---
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# --- Proteccion contra SYN flood (relevante para un servidor SMTP publico) ---
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 4096

# --- Ignorar pings de broadcast y respuestas ICMP de error falsas ---
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- Registrar paquetes con direcciones IP imposibles (martians) ---
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# --- Mitigacion RFC 1337 (TIME-WAIT assassination) ---
net.ipv4.tcp_rfc1337 = 1

# --- ASLR completo ---
kernel.randomize_va_space = 2

# --- Restringir hardlinks/symlinks a ficheros que no son propios (CVE clase FS) ---
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
