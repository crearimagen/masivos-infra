# services/nginx/nginx.conf — configuracion principal. Los server blocks
# especificos de cada servicio (Postal, y mas adelante Grafana/Uptime Kuma)
# viven en conf.d/.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format masivos '$remote_addr - $remote_user [$time_iso8601] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time';
    # stdout/stderr, capturado por el log driver de Docker
    # (docker/daemon.json ya rota estos logs).
    access_log /dev/stdout masivos;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Alineado con SMTP_SERVER_MAX_MESSAGE_SIZE de Postal (14 MB) mas
    # margen, para no bloquear subidas legitimas via el panel/API.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --- TLS compartido por todos los server blocks de conf.d/ ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Cabeceras de seguridad por defecto ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Rate limiting basico (paneles de administracion) ---
    limit_req_zone $binary_remote_addr zone=masivos_login:10m rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
