# services/nginx/conf.d/02-status.conf
# Endpoint stub_status para nginx-prometheus-exporter (services/prometheus/,
# Sprint 10). Sin contenido especifico de dominio - no es una plantilla, se
# versiona tal cual.
#
# Puerto 8080 NO publicado al host (sin entrada "ports:" para el en
# docker-compose.yml) - solo alcanzable desde otros contenedores dentro de
# masivos-network, como nginx-prometheus-exporter. No requiere regla de UFW.

server {
    listen 8080;
    server_name _;

    location /nginx_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
