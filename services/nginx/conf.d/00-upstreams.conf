# services/nginx/conf.d/00-upstreams.conf
# "host.docker.internal" se resuelve via extra_hosts: host-gateway (ver
# docker-compose.yml) a la IP del host desde dentro de masivos-network.
# Postal corre en network_mode: host (ver services/postal/README.md), por
# eso se referencia por esta via en vez de por nombre de contenedor.

upstream postal_web {
    server host.docker.internal:5000;
}
