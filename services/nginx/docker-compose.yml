# services/nginx/docker-compose.yml — reverse proxy TLS-terminating y
# emision de certificados Let's Encrypt (DNS-01, certbot-dns-cloudflare).
# Ejecutable por si solo:
#   docker compose --env-file .env -f services/nginx/docker-compose.yml up -d
# o como parte del stack completo via docker/compose/docker-compose.yml (include:).
#
# Requiere que docker/install.sh ya haya creado masivos-network y el volumen
# masivos-nginx-data, y que services/nginx/ssl/ ya tenga certificados
# emitidos (scripts/issue-certificate.sh) - nginx falla al arrancar si
# faltan, es esperado (ver README.md).

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: masivos-nginx
    restart: unless-stopped
    env_file:
      - .env
    # Permite a este contenedor (en masivos-network) alcanzar servicios que
    # bindean en el host fuera de esa red - unicamente el caso de Postal
    # (network_mode: host, ver services/postal/README.md). Grafana y
    # Uptime Kuma (Sprints 10-11) se alcanzan por nombre de contenedor
    # normalmente, sin necesitar esto.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/letsencrypt:ro
      - masivos-nginx-data:/var/cache/nginx
    networks:
      - masivos-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-1}"
          memory: "${NGINX_MEMORY_LIMIT:-256m}"
        reservations:
          memory: "${NGINX_MEMORY_RESERVATION:-64m}"

  # Servicio de un solo uso (profile: tools, no arranca con "up -d") para
  # emitir/renovar certificados. Ver scripts/issue-certificate.sh y
  # scripts/renew-certificates.sh.
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: masivos-nginx-certbot
    profiles:
      - tools
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./secrets/cloudflare.ini:/secrets/cloudflare.ini:ro
    networks:
      - masivos-network

networks:
  masivos-network:
    external: true

volumes:
  masivos-nginx-data:
    external: true
