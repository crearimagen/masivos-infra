# services/postgres/config/postgresql.conf
# Configuracion de produccion para el Postgres de Masivos.app.
# Montado de solo lectura y cargado explicitamente via -c config_file=...
# (ver docker-compose.yml) — reemplaza por completo el postgresql.conf
# autogenerado, no lo complementa.
#
# Sizing de referencia: servidor con 4 GB de RAM dedicados parcialmente a
# Postgres (ver docs/architecture.md). Reajustar shared_buffers /
# effective_cache_size / work_mem si el servidor de destino tiene otro
# tamano — estos valores no se autodetectan.

# --- Conexion ---
listen_addresses = '*'
port = 5432
max_connections = 100
unix_socket_directories = '/var/run/postgresql'

# --- Memoria ---
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- WAL / durabilidad ---
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
synchronous_commit = on

# --- Planner ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Extensiones (ver init/00-extensions.sql) ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on

# --- Logging ---
# stderr es capturado por el log driver de Docker (docker/daemon.json ya
# rota estos logs); no se necesita logging_collector aqui.
log_destination = 'stderr'
log_min_duration_statement = 250
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = off
log_disconnections = off

# --- Autovacuum (activo, tuning por defecto razonable para esta escala) ---
autovacuum = on
autovacuum_max_workers = 3
