# services/postgres/config/pg_hba.conf
# Postgres nunca publica un puerto al host (ver docs/architecture.md); el
# unico camino de red hacia este contenedor es masivos-network. Por eso este
# archivo no filtra por subnet: la superficie de exposicion la controla la
# ausencia de "ports:" en docker-compose.yml, no pg_hba.conf. Lo que si se
# exige siempre es autenticacion por password (scram-sha-256) — nunca trust.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             all                     scram-sha-256
