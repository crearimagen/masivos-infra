# services/redis/redis.conf
# Configuracion de produccion para el Redis de Masivos.app.
# Montado de solo lectura (ver docker-compose.yml). requirepass NO se
# define aqui: se inyecta en tiempo de ejecucion via --requirepass, para no
# versionar el secreto.

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
# stdout, capturado por el log driver de Docker (docker/daemon.json ya
# rota estos logs).
logfile ""

dir /data

# --- Persistencia RDB (snapshots periodicos) ---
# Complementa AOF: permite una restauracion mas rapida y sirve como
# respaldo adicional ante corrupcion del AOF.
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# --- Persistencia AOF (principal) ---
# everysec acota la perdida de datos posible ante un crash a ~1 segundo de
# escrituras. Ver docs/architecture.md / README de este servicio para la
# justificacion de por que la persistencia esta activa en vez de tratar
# Redis como cache puro.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# --- Memoria ---
# Limite de seguridad para un servidor de referencia de 4 GB de RAM total
# (ver tabla de sizing en docs/architecture.md). Ajustar segun el servidor
# real de destino.
maxmemory 256mb
# noeviction: Redis RECHAZA escrituras nuevas al llegar al limite en vez de
# descartar claves existentes en silencio. Reevaluar a allkeys-lru
# unicamente si se confirma en Sprint 7 que Redis se usa solo como cache
# desechable para Postal.
maxmemory-policy noeviction

# --- Limites operativos ---
maxclients 10000
