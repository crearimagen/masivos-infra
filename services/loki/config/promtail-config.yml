# services/loki/config/promtail-config.yml
# Descubre y recolecta logs de TODOS los contenedores Docker del host
# (via el socket, solo lectura) - incluye los de masivos-network y los de
# network_mode: host (Postal), ya que Docker los expone igual via su API
# independientemente de la red del contenedor.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://masivos-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_id"]
        target_label: container_id
    pipeline_stages:
      - docker: {}
