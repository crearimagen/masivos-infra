# services/loki/docker-compose.yml — agregacion de logs (Loki) + recolector
# (Promtail, lee logs de TODOS los contenedores del host via el socket de
# Docker, solo lectura).
#
# Ejecutable por si solo:
#   docker compose --env-file .env -f services/loki/docker-compose.yml up -d
# o como parte del stack completo via docker/compose/docker-compose.yml (include:).
#
# Requiere que docker/install.sh ya haya creado masivos-network y el volumen
# masivos-loki-data.

services:
  loki:
    image: grafana/loki:3.1.0
    container_name: masivos-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - masivos-loki-data:/loki
    networks:
      - masivos-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-1}"
          memory: "${LOKI_MEMORY_LIMIT:-512m}"
        reservations:
          memory: "${LOKI_MEMORY_RESERVATION:-128m}"

  # Acceso de solo lectura al socket de Docker: es el mecanismo estandar
  # documentado por Grafana para que Promtail descubra y etiquete
  # contenedores automaticamente (nombre, imagen, id). Riesgo aceptado:
  # el socket permite inspeccionar cualquier contenedor del host (no
  # ejecutar comandos en ellos via este mount) - ver README.md.
  promtail:
    image: grafana/promtail:3.1.0
    container_name: masivos-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - masivos-network

networks:
  masivos-network:
    external: true

volumes:
  masivos-loki-data:
    external: true
