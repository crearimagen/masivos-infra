# services/rabbitmq/config/rabbitmq.conf
# Configuracion de produccion para el RabbitMQ de Masivos.app (formato
# nuevo, sysctl-like). Montado de solo lectura (ver docker-compose.yml).
# El usuario/vhost por defecto se bootstrapea via variables de entorno
# (RABBITMQ_DEFAULT_USER/PASS/VHOST en .env), no aqui.

listeners.tcp.default = 5672

management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# vm_memory_high_watermark relativo: RabbitMQ detecta el limite de memoria
# del cgroup del contenedor (deploy.resources.limits.memory en
# docker-compose.yml) y aplica el porcentaje sobre ese limite, no sobre la
# RAM total del host.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# stdout, capturado por el log driver de Docker (docker/daemon.json ya
# rota estos logs).
log.console = true
log.console.level = info
log.file = false

heartbeat = 60
