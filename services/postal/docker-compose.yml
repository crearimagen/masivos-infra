# services/postal/docker-compose.yml — servicio Postal, siguiendo la
# estructura de la plantilla oficial del proyecto (web/smtp/worker/runner,
# network_mode: host en los cuatro) en vez de masivos-network. Justificacion
# completa en README.md y en docs/architecture.md.
#
# Ejecutable por si solo:
#   docker compose --env-file .env -f services/postal/docker-compose.yml up -d
# o como parte del stack completo via docker/compose/docker-compose.yml (include:).
#
# Requiere:
#   - services/mariadb corriendo con el puerto 127.0.0.1:3306 publicado
#   - services/postal/config/signing.key generado (scripts/generate-signing-key.sh)
#   - services/postal/.env completo (ver .env.example)

services:
  web:
    image: ghcr.io/postalserver/postal:${POSTAL_VERSION:-3}
    container_name: masivos-postal-web
    restart: unless-stopped
    command: ["postal", "web-server"]
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - masivos-postal-data:/opt/postal/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://${WEB_SERVER_DEFAULT_BIND_ADDRESS:-127.0.0.1}:${WEB_SERVER_DEFAULT_PORT:-5000}/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  smtp:
    image: ghcr.io/postalserver/postal:${POSTAL_VERSION:-3}
    container_name: masivos-postal-smtp
    restart: unless-stopped
    command: ["postal", "smtp-server"]
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - masivos-postal-data:/opt/postal/var
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${SMTP_SERVER_DEFAULT_HEALTH_SERVER_PORT:-9091} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/postalserver/postal:${POSTAL_VERSION:-3}
    container_name: masivos-postal-worker
    restart: unless-stopped
    command: ["postal", "worker"]
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - masivos-postal-data:/opt/postal/var
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${WORKER_DEFAULT_HEALTH_SERVER_PORT:-9090} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Servicio de un solo uso para comandos administrativos:
  #   docker compose run --rm runner postal initialize
  #   docker compose run --rm -it runner postal make-user
  # No arranca con "up -d" (profile: tools). Ver scripts/initialize-postal.sh
  # y README.md ("Cómo instalarlo").
  runner:
    image: ghcr.io/postalserver/postal:${POSTAL_VERSION:-3}
    container_name: masivos-postal-runner
    network_mode: host
    profiles:
      - tools
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - masivos-postal-data:/opt/postal/var

volumes:
  masivos-postal-data:
    external: true
